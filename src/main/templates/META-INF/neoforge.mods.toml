modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/nekomario28/OffHandCombat/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/nekomario28/OffHandCombat"
authors="Arekkuusu, BunnyCinnamon, nekomario28 contributors"
description="""
Enables server-validated melee attacks with a weapon held in the off hand while preserving normal main-hand interaction priority.
"""

[[mixins]]
config="offhandcombat.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
