name: Diagnose manifest

on:
  push:
    branches: [ 1.21.1-neoforge ]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare source manifest
        shell: bash
        run: |
          set -u
          python3 validate_port.py
          status=0
          while read -r expected path; do
            actual="$(sha256sum "$path" | cut -d' ' -f1)"
            if [[ "$actual" != "$expected" ]]; then
              echo "MISMATCH $path"
              echo "  expected=$expected"
              echo "  actual=$actual"
              status=1
            fi
          done < PORT_MANIFEST.sha256
          exit "$status"
