name: Diagnose manifest

on:
  push:
    branches: [ 1.21.1-neoforge ]
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare source manifest
        shell: bash
        run: |
          set -u
          python3 validate_port.py > manifest-diagnostics.txt 2>&1 || true
          status=0
          while read -r expected path; do
            actual="$(sha256sum "$path" | cut -d' ' -f1)"
            if [[ "$actual" != "$expected" ]]; then
              {
                echo "MISMATCH $path"
                echo "  expected=$expected"
                echo "  actual=$actual"
              } >> manifest-diagnostics.txt
              status=1
            fi
          done < PORT_MANIFEST.sha256
          echo "$status" > manifest-diagnostics.status
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: manifest-diagnostics-${{ github.sha }}
          path: |
            manifest-diagnostics.txt
            manifest-diagnostics.status
      - name: Fail on mismatch
        shell: bash
        run: test "$(cat manifest-diagnostics.status)" = 0
