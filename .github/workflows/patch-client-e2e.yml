name: One-shot client E2E patch

on:
  push:
    branches: [ ci/self-hosted-release-gate ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/self-hosted-release-gate
          fetch-depth: 0
      - name: Apply mapped 1.21.1 inventory API fix and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/clientTest/java/dev/nekomario/offhandcombat/clienttest/OffhandClientWorldE2EHarness.java')
          text = path.read_text()
          old = 'player.getInventory().add(new ItemStack(Items.ARROW, 64));'
          new = 'player.getInventory().setItem(0, new ItemStack(Items.ARROW, 64));'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one source occurrence, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/patch-client-e2e.yml').unlink()
          PY
          git config user.name nekomario28
          git config user.email '206304251+nekomario28@users.noreply.github.com'
          git add src/clientTest/java/dev/nekomario/offhandcombat/clienttest/OffhandClientWorldE2EHarness.java .github/workflows/patch-client-e2e.yml
          git commit -m 'Fix client E2E inventory setup for 1.21.1 mappings'
          git push origin HEAD:ci/self-hosted-release-gate
