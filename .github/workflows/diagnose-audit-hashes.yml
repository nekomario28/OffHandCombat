name: Diagnose audit hashes

on:
  push:
    branches: [ 1.21.1-neoforge ]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record current hashes and manifest mismatches
        shell: bash
        run: |
          set +e
          sha256sum validate_port.py .github/workflows/build.yml > audit-hashes.txt
          while read -r expected path; do
            if [[ -f "$path" ]]; then
              actual="$(sha256sum "$path" | cut -d' ' -f1)"
              if [[ "$actual" != "$expected" ]]; then
                echo "MISMATCH $path expected=$expected actual=$actual" >> audit-hashes.txt
              fi
            else
              echo "MISSING $path expected=$expected" >> audit-hashes.txt
            fi
          done < PORT_MANIFEST.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: audit-hashes-${{ github.sha }}
          path: audit-hashes.txt
