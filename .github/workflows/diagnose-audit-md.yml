name: Diagnose audit document hash

on:
  push:
    branches: [ 1.21.1-neoforge ]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash audit document
        shell: bash
        run: sha256sum AUDIT_1.21.1.md > audit-document-hash.txt
      - uses: actions/upload-artifact@v4
        with:
          name: audit-document-hash-${{ github.sha }}
          path: audit-document-hash.txt
