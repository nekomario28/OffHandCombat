name: Build and audit

on:
  push:
    branches: [ master, 1.21.1-neoforge ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Static port audit
        run: python3 validate_port.py
      - name: Unit tests and build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean test build --stacktrace 2>&1 | tee build.log
      - name: Upload JARs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offhandcombat-1.21.1-${{ github.sha }}
          path: |
            build.log
            build/libs/*.jar
            build/reports/tests/test/**
          if-no-files-found: error
