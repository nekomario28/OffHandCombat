name: Build and audit

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: offhandcombat-interaction-priority
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/self-hosted-release-gate
          fetch-depth: 0

      - name: Apply staged interaction corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('build.gradle')
          text = gradle.read_text()
          text = text.replace(
              "systemProperty 'offhandcombat.networkStressE2E', 'true'",
              "systemProperty 'offhandcombat.networkStressClientE2E', 'true'")
          text = text.replace(
              "programArguments = ['--username', 'OffhandInteractionE2E']",
              "programArguments = ['--username', 'OHCInteract']")
          gradle.write_text(text)

          harness = Path('src/clientTest/java/dev/nekomario/offhandcombat/clienttest/OffhandInteractionPriorityE2EHarness.java')
          text = harness.read_text()
          old = 'interactionPos = player.blockPosition().offset(0, 1, 2);'
          new = 'interactionPos = player.blockPosition().offset(0, 2, 2);'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('interaction position anchor was not recognized')
          harness.write_text(text)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compile candidate
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean test build --stacktrace 2>&1 | tee build.log

      - name: Block interaction priority E2E
        shell: bash
        run: |
          set +e
          bash .ci/client-interaction-e2e.sh 240 > client-interaction-console.log 2>&1
          status=$?
          grep -E 'interaction priority E2E (passed|failed)' client-interaction-console.log || true
          if [[ "$status" -ne 0 ]]; then
            echo '--- interaction E2E tail ---'
            tail -n 140 client-interaction-console.log
          fi
          exit "$status"

      - name: Inspect villager trading API
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find build/moddev/artifacts -type f -name 'neoforge-*.jar' -print -quit)"
          test -n "$artifact"
          {
            javap -classpath "$artifact" -public net.minecraft.world.entity.npc.Villager
            javap -classpath "$artifact" -public net.minecraft.world.entity.npc.VillagerData
            javap -classpath "$artifact" -public net.minecraft.world.item.trading.MerchantOffer
          } | tee villager-api.log

      - name: Persist verified interaction corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name nekomario28
          git config user.email '206304251+nekomario28@users.noreply.github.com'
          git add build.gradle src/clientTest/java/dev/nekomario/offhandcombat/clienttest/OffhandInteractionPriorityE2EHarness.java
          if ! git diff --cached --quiet; then
            git commit -m 'Correct physical interaction E2E targeting'
            git push origin HEAD:ci/self-hosted-release-gate
          fi

      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offhandcombat-interaction-priority-${{ github.sha }}
          path: |
            build.log
            client-interaction-console.log
            client-interaction-e2e.log
            villager-api.log
            run/**/logs/latest.log
            build/libs/*.jar
          if-no-files-found: warn
