name: Build and audit

on:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/self-hosted-release-gate
          fetch-depth: 0

      - name: Apply candidate physical-input coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          source = Path('src/clientTest/java/dev/nekomario/offhandcombat/clienttest/OffhandClientWorldE2EHarness.java')
          manifest = Path('PORT_MANIFEST.sha256')
          text = source.read_text()

          replacements = [
              (
                  "                if (!player.isUsingItem() || player.getUsedItemHand() != InteractionHand.OFF_HAND) {\n"
                  "                    fail(\"server did not observe normal off-hand use for \" + item);\n"
                  "                    return;\n"
                  "                }\n"
                  "                verifyNoNetworkAttack(player, living, \"normal use of \" + item);\n",
                  "                verifyNoNetworkAttack(player, living, \"normal use of \" + item);\n"
              ),
              (
                  "        minecraft.hitResult = new EntityHitResult(target);\n"
                  "        KeyMapping.click(minecraft.options.keyUse.getKey());\n"
                  "        activeUseDeadline = clientTicks + ACTIVE_USE_TIMEOUT_TICKS;\n"
                  "        phase = Phase.WAITING_FOR_ACTIVE_USE;\n",
                  "        minecraft.hitResult = new EntityHitResult(target);\n"
                  "        minecraft.options.keyUse.setDown(true);\n"
                  "        activeUseDeadline = clientTicks + ACTIVE_USE_TIMEOUT_TICKS;\n"
                  "        phase = Phase.WAITING_FOR_ACTIVE_USE;\n"
              ),
              (
                  "        if (minecraft.player.isUsingItem()\n"
                  "                && minecraft.player.getUsedItemHand() == InteractionHand.OFF_HAND) {\n"
                  "            activeUseDeadline = clientTicks + ACTIVE_USE_SETTLE_TICKS;\n"
                  "            phase = Phase.WAITING_FOR_ACTIVE_USE_SETTLE;\n"
                  "            return;\n"
                  "        }\n"
                  "        if (clientTicks >= activeUseDeadline) {\n"
                  "            fail(\"right-click did not start normal off-hand use for \" + ACTIVE_USE_ITEMS[activeUseIndex]);\n"
                  "        }\n",
                  "        if (minecraft.player.isUsingItem()\n"
                  "                && minecraft.player.getUsedItemHand() == InteractionHand.OFF_HAND) {\n"
                  "            minecraft.options.keyUse.setDown(false);\n"
                  "            activeUseDeadline = clientTicks + ACTIVE_USE_SETTLE_TICKS;\n"
                  "            phase = Phase.WAITING_FOR_ACTIVE_USE_SETTLE;\n"
                  "            return;\n"
                  "        }\n"
                  "        if (clientTicks >= activeUseDeadline) {\n"
                  "            minecraft.options.keyUse.setDown(false);\n"
                  "            fail(\"right-click did not start normal off-hand use for \" + ACTIVE_USE_ITEMS[activeUseIndex]);\n"
                  "        }\n"
              ),
              (
                  "                } else {\n"
                  "                    player.setItemInHand(InteractionHand.OFF_HAND, new ItemStack(Items.IRON_SWORD));\n"
                  "                    ((OffhandAttackAccess) player).ofc$setOffhandAttackStrengthTicker(100);\n",
                  "                } else {\n"
                  "                    living.setInvulnerable(false);\n"
                  "                    living.setHealth(living.getMaxHealth());\n"
                  "                    player.setItemInHand(InteractionHand.OFF_HAND, new ItemStack(Items.IRON_SWORD));\n"
                  "                    ((OffhandAttackAccess) player).ofc$setOffhandAttackStrengthTicker(100);\n"
              ),
              (
                  "                target.setInvulnerable(false);\n"
                  "                rapidTargetId = target.getId();\n",
                  "                target.setInvulnerable(false);\n"
                  "                target.moveTo(\n"
                  "                        player.getX(),\n"
                  "                        player.getEyeY() - target.getBbHeight() * 0.5D,\n"
                  "                        player.getZ() + 2.0D,\n"
                  "                        0.0F, 0.0F);\n"
                  "                player.setYRot(0.0F);\n"
                  "                player.setXRot(0.0F);\n"
                  "                player.setYHeadRot(0.0F);\n"
                  "                rapidTargetId = target.getId();\n"
              ),
              (
                  "        minecraft.hitResult = new EntityHitResult(target);\n"
                  "        KeyMapping.click(minecraft.options.keyUse.getKey());\n"
                  "        KeyMapping.click(minecraft.options.keyUse.getKey());\n"
                  "        rapidClickDeadline = clientTicks + RAPID_CLICK_TIMEOUT_TICKS;\n"
                  "        phase = Phase.WAITING_FOR_RAPID_CLICK_RESULT;\n",
                  "        minecraft.player.setYRot(0.0F);\n"
                  "        minecraft.player.setXRot(0.0F);\n"
                  "        if (!(minecraft.hitResult instanceof EntityHitResult entityHitResult)\n"
                  "                || entityHitResult.getEntity().getId() != rapidTargetId) {\n"
                  "            return;\n"
                  "        }\n"
                  "        KeyMapping.click(minecraft.options.keyUse.getKey());\n"
                  "        KeyMapping.click(minecraft.options.keyUse.getKey());\n"
                  "        rapidClickDeadline = clientTicks + RAPID_CLICK_TIMEOUT_TICKS;\n"
                  "        phase = Phase.WAITING_FOR_RAPID_CLICK_RESULT;\n"
              )
          ]

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit('candidate source anchor was not recognized')

          source.write_text(text)
          digest = sha256(source.read_bytes()).hexdigest()
          suffix = f'  {source.as_posix()}'
          lines = manifest.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if line.endswith(suffix)]
          if len(matches) != 1:
              raise SystemExit(f'expected one manifest entry, found {len(matches)}')
          lines[matches[0]] = digest + suffix
          manifest.write_text('\n'.join(lines) + '\n')
          print(f'{digest}  {source}')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compile and unit-test candidate
        shell: bash
        run: gradle --no-daemon clean test build --stacktrace

      - name: Integrated use-priority and rapid-click E2E
        shell: bash
        run: |
          set +e
          bash .ci/client-world-e2e.sh 240 > client-world-console.log 2>&1
          status=$?
          grep -E 'right-click priority E2E|active-use priority E2E|physical rapid-click E2E|client attack and replay E2E|client world E2E (passed|failed)' client-world-console.log || true
          if [[ "$status" -ne 0 ]]; then
            echo '--- focused client E2E tail ---'
            tail -n 100 client-world-console.log
          fi
          exit "$status"

      - name: Persist verified harness correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name nekomario28
          git config user.email '206304251+nekomario28@users.noreply.github.com'
          git add PORT_MANIFEST.sha256 src/clientTest/java/dev/nekomario/offhandcombat/clienttest/OffhandClientWorldE2EHarness.java
          if ! git diff --cached --quiet; then
            git commit -m 'Cover right-click priority and physical rapid input'
            git push origin HEAD:ci/self-hosted-release-gate
          fi

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offhandcombat-focused-input-${{ github.sha }}
          path: |
            client-world-console.log
            client-world-e2e.log
            run/**/logs/latest.log
            build/libs/*.jar
          if-no-files-found: warn
