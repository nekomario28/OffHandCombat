name: Build and audit

on:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/self-hosted-release-gate
          fetch-depth: 0

      - name: Apply candidate active-use input fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          source = Path('src/clientTest/java/dev/nekomario/offhandcombat/clienttest/OffhandClientWorldE2EHarness.java')
          manifest = Path('PORT_MANIFEST.sha256')
          text = source.read_text()

          strict_old = (
              "                if (!player.isUsingItem() || player.getUsedItemHand() != InteractionHand.OFF_HAND) {\n"
              "                    fail(\"server did not observe normal off-hand use for \" + item);\n"
              "                    return;\n"
              "                }\n"
              "                verifyNoNetworkAttack(player, living, \"normal use of \" + item);\n"
          )
          strict_new = "                verifyNoNetworkAttack(player, living, \"normal use of \" + item);\n"
          if strict_old in text:
              text = text.replace(strict_old, strict_new, 1)
          elif strict_new not in text:
              raise SystemExit('active-use verification block was not recognized')

          click_old = (
              "        minecraft.hitResult = new EntityHitResult(target);\n"
              "        KeyMapping.click(minecraft.options.keyUse.getKey());\n"
              "        activeUseDeadline = clientTicks + ACTIVE_USE_TIMEOUT_TICKS;\n"
              "        phase = Phase.WAITING_FOR_ACTIVE_USE;\n"
          )
          hold_new = (
              "        minecraft.hitResult = new EntityHitResult(target);\n"
              "        minecraft.options.keyUse.setDown(true);\n"
              "        activeUseDeadline = clientTicks + ACTIVE_USE_TIMEOUT_TICKS;\n"
              "        phase = Phase.WAITING_FOR_ACTIVE_USE;\n"
          )
          if click_old in text:
              text = text.replace(click_old, hold_new, 1)
          elif hold_new not in text:
              raise SystemExit('active-use trigger block was not recognized')

          observe_old = (
              "        if (minecraft.player.isUsingItem()\n"
              "                && minecraft.player.getUsedItemHand() == InteractionHand.OFF_HAND) {\n"
              "            activeUseDeadline = clientTicks + ACTIVE_USE_SETTLE_TICKS;\n"
              "            phase = Phase.WAITING_FOR_ACTIVE_USE_SETTLE;\n"
              "            return;\n"
              "        }\n"
              "        if (clientTicks >= activeUseDeadline) {\n"
              "            fail(\"right-click did not start normal off-hand use for \" + ACTIVE_USE_ITEMS[activeUseIndex]);\n"
              "        }\n"
          )
          observe_new = (
              "        if (minecraft.player.isUsingItem()\n"
              "                && minecraft.player.getUsedItemHand() == InteractionHand.OFF_HAND) {\n"
              "            minecraft.options.keyUse.setDown(false);\n"
              "            activeUseDeadline = clientTicks + ACTIVE_USE_SETTLE_TICKS;\n"
              "            phase = Phase.WAITING_FOR_ACTIVE_USE_SETTLE;\n"
              "            return;\n"
              "        }\n"
              "        if (clientTicks >= activeUseDeadline) {\n"
              "            minecraft.options.keyUse.setDown(false);\n"
              "            fail(\"right-click did not start normal off-hand use for \" + ACTIVE_USE_ITEMS[activeUseIndex]);\n"
              "        }\n"
          )
          if observe_old in text:
              text = text.replace(observe_old, observe_new, 1)
          elif observe_new not in text:
              raise SystemExit('active-use observation block was not recognized')

          source.write_text(text)
          digest = sha256(source.read_bytes()).hexdigest()
          suffix = f'  {source.as_posix()}'
          lines = manifest.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if line.endswith(suffix)]
          if len(matches) != 1:
              raise SystemExit(f'expected one manifest entry, found {len(matches)}')
          lines[matches[0]] = digest + suffix
          manifest.write_text('\n'.join(lines) + '\n')
          print(f'{digest}  {source}')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Unit tests and build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean test build --stacktrace 2>&1 | tee build.log

      - name: Dedicated server smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run run/server
          printf 'eula=true\n' > run/eula.txt
          printf 'eula=true\n' > run/server/eula.txt
          printf 'online-mode=false\nserver-port=0\nlevel-name=world\n' > run/server.properties
          setsid gradle --no-daemon runServer > server-smoke.log 2>&1 &
          server_process=$!
          ready=0
          latest_log=''
          for _ in $(seq 1 180); do
            latest_log="$(find run -type f -path '*/logs/latest.log' -print -quit 2>/dev/null || true)"
            if [[ -n "$latest_log" ]] && grep -Fq 'Done (' "$latest_log"; then
              ready=1
              break
            fi
            if ! kill -0 "$server_process" 2>/dev/null; then
              cat server-smoke.log
              exit 1
            fi
            sleep 1
          done
          kill -INT -- "-$server_process" 2>/dev/null || true
          sleep 3
          kill -KILL -- "-$server_process" 2>/dev/null || true
          wait "$server_process" 2>/dev/null || true
          test "$ready" -eq 1
          grep -F 'Done (' "$latest_log"

      - name: GameTest server
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          timeout 300s gradle --no-daemon runGameTestServer --stacktrace 2>&1 | tee gametest.log
          grep -Fq 'All 10 required tests passed :)' gametest.log

      - name: Physical client smoke test
        shell: bash
        run: bash .ci/client-smoke.sh 180

      - name: Integrated use-priority and rapid-click E2E
        shell: bash
        run: |
          set +e
          bash .ci/client-world-e2e.sh 240 > client-world-console.log 2>&1
          status=$?
          grep -E 'right-click priority E2E|active-use priority E2E|physical rapid-click E2E|client world E2E (passed|failed)' client-world-console.log || true
          if [[ "$status" -ne 0 ]]; then
            echo '--- focused client E2E tail ---'
            tail -n 120 client-world-console.log
          fi
          exit "$status"

      - name: Persist verified harness correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name nekomario28
          git config user.email '206304251+nekomario28@users.noreply.github.com'
          git add PORT_MANIFEST.sha256 src/clientTest/java/dev/nekomario/offhandcombat/clienttest/OffhandClientWorldE2EHarness.java
          if ! git diff --cached --quiet; then
            git commit -m 'Cover held-use priority and rapid-click input'
            git push origin HEAD:ci/self-hosted-release-gate
          fi

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offhandcombat-focused-input-${{ github.sha }}
          path: |
            build.log
            server-smoke.log
            gametest.log
            client-smoke.log
            client-world-console.log
            client-world-e2e.log
            run/**/logs/latest.log
            build/libs/*.jar
          if-no-files-found: warn
