name: Build and audit

on:
  push:
    branches: [ master, 1.21.1-neoforge ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Static port audit
        shell: bash
        run: |
          set -euo pipefail
          python3 validate_port.py
          sha256sum --check PORT_MANIFEST.sha256
      - name: Unit tests and build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean test build --stacktrace 2>&1 | tee build.log
      - name: Verify distributable JAR
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar_file"
          for entry in \
            LICENSE \
            META-INF/neoforge.mods.toml \
            offhandcombat.mixins.json \
            dev/nekomario/offhandcombat/OffHandCombat.class \
            assets/offhandcombat/lang/en_us.json \
            assets/offhandcombat/lang/ja_jp.json
          do
            jar tf "$jar_file" | grep -Fqx "$entry"
          done
          sha256sum "$jar_file"
      - name: Upload JARs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offhandcombat-1.21.1-${{ github.sha }}
          path: |
            build.log
            build/libs/*.jar
            build/reports/tests/test/**
          if-no-files-found: error
