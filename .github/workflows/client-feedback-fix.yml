name: Client feedback fix verification

on:
  push:
    branches: [ fix/client-swing-cooldown-hud ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: client-feedback-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Ensure virtual display
        shell: bash
        run: |
          set -euo pipefail
          if command -v xvfb-run >/dev/null 2>&1; then
            exit 0
          fi
          if command -v pacman >/dev/null 2>&1; then
            sudo pacman -S --needed --noconfirm xorg-server-xvfb
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          else
            echo 'No supported package manager for xvfb-run' >&2
            exit 1
          fi
      - name: Unit tests and build
        shell: bash
        run: gradle --no-daemon clean test build --stacktrace
      - name: Physical client startup
        shell: bash
        run: bash .ci/client-smoke.sh 180
      - name: Verify new production classes are packaged
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar_file"
          jar tf "$jar_file" | grep -Fqx 'dev/nekomario/offhandcombat/client/ClientHudHandler.class'
          jar tf "$jar_file" | grep -Fqx 'dev/nekomario/offhandcombat/client/ClientInputHandler.class'
          sha256sum "$jar_file"
      - name: Upload candidate JAR
        uses: actions/upload-artifact@v4
        with:
          name: offhandcombat-client-feedback-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
