name: Client feedback fix verification

on:
  push:
    branches: [ fix/client-swing-cooldown-hud ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: client-feedback-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Candidate hashes
        shell: bash
        run: |
          sha256sum \
            .ci/client-interaction-e2e.sh \
            build.gradle \
            src/clientTest/java/dev/nekomario/offhandcombat/clienttest/OffhandAirSwingE2EHarness.java \
            src/main/java/dev/nekomario/offhandcombat/client/ClientInputHandler.java \
            src/main/java/dev/nekomario/offhandcombat/client/ClientHudHandler.java \
            src/main/java/dev/nekomario/offhandcombat/attachment/OffhandCombatState.java \
            src/main/java/dev/nekomario/offhandcombat/network/OffHandCombatNetwork.java \
            src/main/java/dev/nekomario/offhandcombat/util/ClientCooldownResetWindow.java \
            src/test/java/dev/nekomario/offhandcombat/util/ClientCooldownResetWindowTest.java
      - name: Generate final manifest candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          excluded = {
              'PORT_MANIFEST.sha256',
              '.github/workflows/client-feedback-fix.yml',
          }
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          lines = []
          for raw in paths:
              if not raw:
                  continue
              path = raw.decode()
              if path in excluded:
                  continue
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              lines.append(f'{digest}  {path}')
          Path('PORT_MANIFEST.generated').write_text(
              '\n'.join(sorted(lines)) + '\n',
              encoding='utf-8',
          )
          PY
          wc -l PORT_MANIFEST.generated
          sha256sum PORT_MANIFEST.generated
      - name: Ensure virtual display
        shell: bash
        run: |
          set -euo pipefail
          if command -v xvfb-run >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Unit tests, client harness compilation and build
        shell: bash
        run: gradle --no-daemon clean test compileClientTestJava build --stacktrace
      - name: Physical client startup
        shell: bash
        run: bash .ci/client-smoke.sh 180
      - name: Integrated client input E2Es
        shell: bash
        run: bash .ci/client-world-e2e.sh 300
      - name: Verify new production classes are packaged
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar_file"
          jar tf "$jar_file" | grep -Fqx 'dev/nekomario/offhandcombat/client/ClientHudHandler.class'
          jar tf "$jar_file" | grep -Fqx 'dev/nekomario/offhandcombat/client/ClientInputHandler.class'
          jar tf "$jar_file" | grep -Fqx 'dev/nekomario/offhandcombat/util/ClientCooldownResetWindow.class'
          ! jar tf "$jar_file" | grep -Fq 'dev/nekomario/offhandcombat/clienttest/'
          sha256sum "$jar_file"
      - name: Upload candidate JAR, manifest and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offhandcombat-client-feedback-${{ github.sha }}
          path: |
            PORT_MANIFEST.generated
            build/libs/*.jar
            client-smoke.log
            client-world-e2e.log
            client-air-swing-e2e.log
            client-interaction-e2e.log
            client-villager-e2e.log
            run/**/logs/latest.log
          if-no-files-found: warn
