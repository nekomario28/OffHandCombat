name: Diagnose isolated GameTest

on:
  push:
    branches: [ 1.21.1-neoforge ]
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose validation and manifest
        shell: bash
        run: |
          set +e
          python3 validate_port.py > isolated-gametest-diagnostics.txt 2>&1
          echo "validate_status=$?" >> isolated-gametest-diagnostics.txt
          while read -r expected path; do
            actual="$(sha256sum "$path" | cut -d' ' -f1)"
            if [[ "$actual" != "$expected" ]]; then
              echo "MISMATCH $path expected=$expected actual=$actual" >> isolated-gametest-diagnostics.txt
            fi
          done < PORT_MANIFEST.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-gametest-diagnostics-${{ github.sha }}
          path: isolated-gametest-diagnostics.txt
