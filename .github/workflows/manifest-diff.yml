name: Manifest regeneration diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-swing-cooldown-hud
      - name: Regenerate and validate manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          excluded = {
              'PORT_MANIFEST.sha256',
              '.github/workflows/manifest-diff.yml',
          }
          lines = []
          for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
              if not raw:
                  continue
              path = raw.decode()
              if path in excluded:
                  continue
              lines.append(f'{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}')
          Path('PORT_MANIFEST.regenerated').write_text('\n'.join(sorted(lines)) + '\n', encoding='utf-8')
          PY
          diff -u PORT_MANIFEST.sha256 PORT_MANIFEST.regenerated | tee PORT_MANIFEST.diff || true
          sha256sum --check PORT_MANIFEST.regenerated
      - name: Persist exact regenerated manifest
        shell: bash
        run: |
          set -euo pipefail
          if cmp -s PORT_MANIFEST.sha256 PORT_MANIFEST.regenerated; then
            exit 0
          fi
          cp PORT_MANIFEST.regenerated PORT_MANIFEST.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PORT_MANIFEST.sha256
          git commit -m 'Refresh source integrity manifest exactly'
          git push origin HEAD:fix/client-swing-cooldown-hud
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offhandcombat-manifest-diagnostic-${{ github.sha }}
          path: |
            PORT_MANIFEST.sha256
            PORT_MANIFEST.regenerated
            PORT_MANIFEST.diff
          if-no-files-found: error
