plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    clientTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    remoteTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    addModdingDependenciesTo sourceSets.gameTest
    addModdingDependenciesTo sourceSets.clientTest
    addModdingDependenciesTo sourceSets.remoteTest

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        clientWorldE2E {
            client()
            gameDirectory = project.file('run')
            sourceSet = sourceSets.clientTest
            programArguments = ['--username', 'OffhandE2E']
            systemProperty 'offhandcombat.clientWorldE2E', 'true'
        }
        remoteServerE2E {
            server()
            gameDirectory = project.file('run/remote-server')
            sourceSet = sourceSets.remoteTest
            programArgument '--nogui'
            jvmArgument '-Xms256m'
            jvmArgument '-Xmx1024m'
            systemProperty 'offhandcombat.remoteServerE2E', 'true'
        }
        remoteClientAE2E {
            client()
            gameDirectory = project.file('run/remote-client-a')
            sourceSet = sourceSets.remoteTest
            programArguments = ['--username', 'OffhandRemoteA']
            jvmArgument '-Xms256m'
            jvmArgument '-Xmx1536m'
            systemProperty 'offhandcombat.remoteClientE2E', 'true'
            systemProperty 'offhandcombat.remoteClientRole', 'A'
        }
        remoteClientBE2E {
            client()
            gameDirectory = project.file('run/remote-client-b')
            sourceSet = sourceSets.remoteTest
            programArguments = ['--username', 'OffhandRemoteB']
            jvmArgument '-Xms256m'
            jvmArgument '-Xmx1536m'
            systemProperty 'offhandcombat.remoteClientE2E', 'true'
            systemProperty 'offhandcombat.remoteClientRole', 'B'
        }
        lifecycleServerE2E {
            server()
            gameDirectory = project.file('run/lifecycle-server')
            sourceSet = sourceSets.remoteTest
            programArgument '--nogui'
            jvmArgument '-Xms256m'
            jvmArgument '-Xmx1024m'
            systemProperty 'offhandcombat.lifecycleServerE2E', 'true'
        }
        lifecycleClientE2E {
            client()
            gameDirectory = project.file('run/lifecycle-client')
            sourceSet = sourceSets.remoteTest
            programArguments = ['--username', 'OffhandLifecycle']
            jvmArgument '-Xms256m'
            jvmArgument '-Xmx1536m'
            systemProperty 'offhandcombat.lifecycleClientE2E', 'true'
        }
        networkStressServerE2E {
            server()
            gameDirectory = project.file('run/stress-server')
            sourceSet = sourceSets.remoteTest
            programArgument '--nogui'
            jvmArgument '-Xms256m'
            jvmArgument '-Xmx1024m'
            systemProperty 'offhandcombat.networkStressServerE2E', 'true'
        }
        networkStressClientE2E {
            client()
            gameDirectory = project.file('run/stress-client')
            sourceSet = sourceSets.remoteTest
            programArguments = ['--username', 'OffhandStress']
            jvmArgument '-Xms256m'
            jvmArgument '-Xmx1536m'
            systemProperty 'offhandcombat.networkStressClientE2E', 'true'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
            sourceSet(sourceSets.clientTest)
            sourceSet(sourceSets.remoteTest)
        }
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
    clientTestImplementation.extendsFrom implementation
    clientTestRuntimeOnly.extendsFrom runtimeOnly
    remoteTestImplementation.extendsFrom implementation
    remoteTestRuntimeOnly.extendsFrom runtimeOnly
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources', ProcessResources).configure {
    from('LICENSE')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
